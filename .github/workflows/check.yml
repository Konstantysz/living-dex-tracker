name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # wiki-structure.py compares pages with origin/main and reads git dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Same as `npm run wiki:lint`. The wrapper is stdlib-only, so plain python3 runs it without uv.
      - run: python3 scripts/wiki-lint.py
      - run: npm run build
